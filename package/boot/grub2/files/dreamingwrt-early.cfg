serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
echo "DreamingWrt bootloader: locating DWRT_BOOT"
search --no-floppy --label --set=dwrt_boot DWRT_BOOT
set root=${dwrt_boot}
set prefix=(${dwrt_boot})/boot/grub
configfile ${prefix}/grub.cfg
echo "DreamingWrt bootloader: failed to load ${prefix}/grub.cfg"
