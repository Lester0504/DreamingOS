<!doctype html>
<html lang="zh-CN" data-theme-resolved="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/menu-shell.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/dwrt-theme.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/ui-kit/dwrt-ui-kit.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/gateway-shadow.css">
  <style>
    :root {
      --app-radius-card: 8px; --app-radius-control: 8px; --app-radius-compact: 6px;
      --app-text: rgb(239 245 252); --app-text-secondary: rgb(214 224 238);
      --app-text-muted: rgb(177 193 213); --app-accent: rgb(46 139 255);
      --color-text-primary: var(--app-text); --color-text-secondary: var(--app-text-secondary);
      --color-text-muted: var(--app-text-muted); --color-accent: var(--app-accent);
      --color-danger: rgb(239 86 99); --color-success: rgb(58 194 123);
      --color-warning: rgb(238 177 52); --color-border-subtle: rgb(255 255 255 / .13);
      --dwrt-kit-text: var(--app-text); --dwrt-kit-muted: var(--app-text-muted);
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--app-text); background: linear-gradient(135deg, rgb(17 48 79), rgb(80 44 29)); font-family: system-ui, sans-serif; }
    .console-stage { width: 100%; height: 100%; min-width: 0; min-height: 0; display: grid; }
    [data-dwrt-surface="stable-glass"], .shadow-operation-bar, .shadow-preflight, .shadow-availability { background: rgb(12 20 31 / .62); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); }
  </style>
</head>
<body>
  <main class="console-stage"><div class="route-preview" id="routePreview"></div></main>
  <script src="../../files/www/dreamingwrt/static/ui-kit/lucide.min.js"></script>
  <script src="../../files/www/dreamingwrt/static/ui-kit/dwrt-ui-kit.js"></script>
  <script type="module">
    import { mount } from '../../files/www/dreamingwrt/plugins/native/gateway-shadow.js';

    localStorage.setItem('dreamingwrt.web.role', 'owner');
    const root = document.getElementById('routePreview');
    const writes = [];
    const capabilities = {
      read: true, save: true, preflight: true, status: true, pairing_supported: true,
      apply_supported: false, disable_supported: true, vrrp_supported: false,
      connection_sync_supported: false, secrets_write_only: true,
      session_continuity: 'best_effort', reason: 'mutual_authenticated_peer_pairing_pending'
    };
    const config = {
      enabled: false, role: 'primary', lan_interface: 'br-lan', management_ipv4: '192.168.30.2/24',
      heartbeat_interface: 'eth1', heartbeat_local_ip: '169.254.30.1', heartbeat_peer_ip: '169.254.30.2',
      heartbeat_prefix_length: 30, virtual_ipv4: '192.168.30.1/24', virtual_router_id: 51,
      priority: 150, advert_interval_seconds: 1, preempt: false, connection_sync: true
    };
    const status = {
      state: 'blocked', vrrp_state: 'FAULT', configured_role: 'primary', runtime_role: 'disabled',
      enabled: false, paired: false, peer_reachable: null, keepalived_available: false,
      keepalived_running: false, conntrackd_available: false, conntrackd_running: false,
      virtual_ipv4_present: false, session_continuity: 'best_effort',
      last_error: 'mutual_authenticated_peer_pairing_pending', capabilities
    };
    const preflight = {
      ready: false, reason: 'mutual_authenticated_peer_pairing_pending', capabilities, errors: [],
      checks: [
        { name: 'configuration', passed: true }, { name: 'lan_interface', passed: true },
        { name: 'heartbeat_interface', passed: true },
        { name: 'keepalived', passed: false, reason: 'keepalived_not_installed' },
        { name: 'conntrackd', passed: false, reason: 'conntrackd_not_installed' },
        { name: 'mutual_peer_trust', passed: false, reason: 'mutual_authenticated_peer_pairing_pending' }
      ]
    };

    const originalFetch = window.fetch.bind(window);
    window.fetch = async (url, init = {}) => {
      const target = new URL(url, location.href).pathname;
      const method = String(init.method || 'GET').toUpperCase();
      if (!target.startsWith('/api/v1/network/gateway-shadow')) return originalFetch(url, init);
      if (method !== 'GET') writes.push({ target, method, body: init.body || '' });
      const payload = target.endsWith('/status') ? status
        : target.endsWith('/preflight') ? preflight
          : { config, peer: { trust_state: 'unpaired', peer_id: '', certificate_fingerprint: '' }, capabilities };
      return new Response(JSON.stringify({ code: 2000, data: payload }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    };

    let instance = mount({
      root,
      ui: {
        mountAll: node => window.DWRT_UI_KIT.mountAll(node),
        confirmationMarkup: (...args) => window.DWRT_UI_KIT.confirmationMarkup(...args),
        scheduleAdaptiveForegroundSample: (delay = 0, scopeRoot = root) => setTimeout(() => {
          const scope = scopeRoot || root;
          [...scope.querySelectorAll('[data-adaptive-sample]')].forEach(node => node.setAttribute('data-adaptive-region', 'light'));
        }, delay)
      },
      utils: { escapeHtml: value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]) }
    });

    window.GATEWAY_SHADOW_FIXTURE = {
      writes,
      async ready() {
        for (let index = 0; index < 80; index += 1) {
          if (root.querySelector('.shadow-status-grid')) return true;
          await new Promise(resolve => setTimeout(resolve, 25));
        }
        return false;
      },
      unmount() { instance?.unmount?.(); instance = null; }
    };
  </script>
</body>
</html>
