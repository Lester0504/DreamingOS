<!doctype html>
<html lang="zh-CN" data-theme-resolved="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/menu-shell.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/dwrt-theme.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/ui-kit/dwrt-ui-kit.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/ai-assistant.css">
  <style>
    :root {
      --app-radius-card: 8px; --app-radius-control: 8px; --app-radius-compact: 6px;
      --app-page-gap: 16px;
      --app-text: rgb(239 245 252); --app-text-secondary: rgb(214 224 238);
      --app-text-muted: rgb(177 193 213); --app-accent: rgb(46 139 255);
      --color-text-primary: var(--app-text); --color-text-secondary: var(--app-text-secondary);
      --color-text-muted: var(--app-text-muted); --color-accent: var(--app-accent);
      --color-danger: rgb(239 86 99); --color-success: rgb(58 194 123);
      --color-warning: rgb(238 177 52); --color-border-subtle: rgb(255 255 255 / .13);
      --dwrt-kit-text: var(--app-text); --dwrt-kit-muted: var(--app-text-muted);
    }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { color: var(--app-text); background: linear-gradient(135deg, rgb(17 48 79), rgb(80 44 29)); font-family: system-ui, sans-serif; }
    .console-stage { width: 100%; min-height: 100%; min-width: 0; display: grid; padding: 14px; box-sizing: border-box; }
    .dwrt-kit-glass-surface, .dwrt-kit-overview-card { background: rgb(12 20 31 / .62); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); }
  </style>
</head>
<body>
  <main class="console-stage"><div class="route-preview" id="routePreview"></div></main>
  <script src="../../files/www/dreamingwrt/static/ui-kit/lucide.min.js"></script>
  <script src="../../files/www/dreamingwrt/static/ui-kit/dwrt-ui-kit.js"></script>
  <script type="module">
    import { mount } from '../../files/www/dreamingwrt/plugins/native/ai-assistant.js';

    localStorage.setItem('dreamingwrt.web.role', 'owner');
    const root = document.getElementById('routePreview');
    const writes = [];
    const config = {
      provider: 'openai', api_base: '', api_key_set: true, api_key: 'sk-***abcd',
      auth_mode: 'api_key', model: 'gpt-4o', temperature: 0.7, max_tokens: 4096,
      system_prompt: '', tool_policy: 'confirm_medium', enabled: true,
      reasoning_effort: 'auto', reasoning_api_shape: 'chat_completions',
      capabilities: {
        reasoning_effort_supported: true, reasoning_effort_values: ['auto', 'low', 'medium', 'high'],
        provider_test: true, provider_models_sync: true, chat_runtime: true
      },
      oauth: { available: false, catalog: [] }
    };

    const originalFetch = window.fetch.bind(window);
    window.fetch = async (url, init = {}) => {
      const target = new URL(url, location.href).pathname;
      const method = String(init.method || 'GET').toUpperCase();
      if (!target.startsWith('/api/v1/ai/')) return originalFetch(url, init);
      if (method !== 'GET') writes.push({ target, method, body: init.body || '' });
      const payload = target.endsWith('/models') ? ['gpt-4o', 'gpt-4o-mini'] : config;
      return new Response(JSON.stringify({ code: 2000, data: payload }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    };

    let instance = mount({
      root,
      mode: 'settings-route',
      ui: {
        mountAll: node => window.DWRT_UI_KIT.mountAll(node),
        confirmationMarkup: (...args) => window.DWRT_UI_KIT.confirmationMarkup(...args),
        statusBadgeMarkup: (...args) => window.DWRT_UI_KIT.statusBadgeMarkup(...args),
        overviewCardsMarkup: (...args) => window.DWRT_UI_KIT.overviewCardsMarkup(...args),
        scheduleAdaptiveForegroundSample: (delay = 0, scopeRoot = root) => setTimeout(() => {
          const scope = scopeRoot || root;
          [...scope.querySelectorAll('[data-adaptive-sample]')].forEach(node => node.setAttribute('data-adaptive-region', 'light'));
        }, delay),
        scheduleGlassCardsRender: () => {}
      },
      utils: { escapeHtml: value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]) }
    });

    window.LLM_SETTINGS_FIXTURE = {
      writes,
      async ready() {
        for (let index = 0; index < 80; index += 1) {
          if (root.querySelector('.ai-settings-tabs')) return true;
          await new Promise(resolve => setTimeout(resolve, 25));
        }
        return false;
      },
      unmount() { instance?.unmount?.(); instance = null; }
    };
  </script>
</body>
</html>
