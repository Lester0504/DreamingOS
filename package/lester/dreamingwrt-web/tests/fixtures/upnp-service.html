<!doctype html>
<html lang="zh-CN" data-theme-resolved="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/menu-shell.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/dwrt-theme.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/ui-kit/dwrt-ui-kit.css">
  <link rel="stylesheet" href="../../files/www/dreamingwrt/static/css/upnp-service.css">
  <style>
    :root {
      --app-menu-glass-width: 48px;
      --app-radius-card: 24px;
      --app-radius-panel: 18px;
      --app-radius-control: 12px;
      --app-text: rgb(239 245 252);
      --app-text-secondary: rgb(214 224 238);
      --app-text-muted: rgb(177 193 213);
      --app-accent: rgb(46 139 255);
      --color-text-primary: var(--app-text);
      --color-text-secondary: var(--app-text-secondary);
      --color-text-muted: var(--app-text-muted);
      --color-accent: var(--app-accent);
      --color-on-accent: white;
      --color-danger: rgb(239 86 99);
      --color-warning: rgb(238 177 52);
      --color-border-control: rgb(255 255 255 / .2);
      --color-border-subtle: rgb(255 255 255 / .12);
      --color-surface-control: rgb(255 255 255 / .06);
      --dwrt-glass-ink: var(--app-text);
      --dwrt-glass-text: var(--app-text-secondary);
      --dwrt-glass-muted: var(--app-text-muted);
      --dwrt-kit-text: var(--app-text);
      --dwrt-kit-muted: var(--app-text-muted);
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--app-text); background: linear-gradient(135deg, rgb(17 48 79), rgb(80 44 29)); font-family: system-ui, sans-serif; }
    .console-stage { width: 100%; height: 100%; min-width: 0; min-height: 0; display: grid; }
  </style>
</head>
<body>
  <main class="console-stage"><div class="route-preview" id="routePreview"></div></main>
  <script src="../../files/www/dreamingwrt/static/ui-kit/lucide.min.js"></script>
  <script src="../../files/www/dreamingwrt/static/ui-kit/dwrt-ui-kit.js"></script>
  <script type="module">
    import { mount } from '../../files/www/dreamingwrt/plugins/native/upnp-service.js';

    const root = document.getElementById('routePreview');
    const writes = [];
    const service = {
      enabled: true,
      natpmp_enabled: true,
      pcp: false,
      secure_mode: true,
      log_packets: false,
      system_uptime: true,
      force_forwarding: false,
      use_stun: false,
      external_iface: 'wan',
      internal_ifaces: ['lan', 'lan20'],
      port_range: { start: 1024, end: 65535 },
      download_mbps: 8,
      upload_mbps: 4,
      notify_interval: 30,
      clean_interval: 600,
      stun_host: '',
      stun_port: 3478,
      acl: [
        { id: 'allow-lan', action: 'allow', external: '1024-65535', internal: '192.168.30.0/24', internal_ports: '1024-65535', remark: 'LAN', enabled: true, sort_order: 0 },
        { id: 'deny-all', action: 'deny', external: '0-65535', internal: '0.0.0.0/0', internal_ports: '0-65535', remark: '默认拒绝', enabled: true, sort_order: 100 }
      ],
      mappings: [
        { id: 'dynamic-1', mapping_type: 'dynamic', protocol: 'tcp', external_port: 42000, internal_ip: '192.168.30.21', internal_port: 42000, client: 'LivingRoom', description: 'Game session', lease_seconds: 3600, packets: 0 }
      ],
      stats: { active_mappings: 1, requests_today: 0, denied_today: 0 },
      capabilities: {
        miniupnpd: true,
        natpmp: true,
        pcp: false,
        stun: false,
        service_update: true,
        acl_create: true,
        acl_update: true,
        acl_delete: true,
        dynamic_mapping_read: true,
        static_mapping_read: true,
        mapping_create: false,
        mapping_update: false,
        mapping_delete: false,
        save_upnp_mapping: false,
        delete_upnp_mapping: false,
        static_mapping_apply: false,
        static_mapping_readback: false,
        live_packets: false,
        stun_host: false,
        stun_port: false,
        port_range: false,
        clean_interval: false,
        force_forwarding: false
      }
    };
    const staticMappings = {
      mappings: [
        { id: 'static-1', mapping_type: 'static', enabled: true, protocol: 'udp', external_port: 51820, internal_ip: '192.168.30.2', internal_port: 51820, client: 'VPN', description: 'WireGuard', lease: 0, packets: 0 }
      ]
    };

    const originalFetch = window.fetch.bind(window);
    window.fetch = async (url, init = {}) => {
      const target = new URL(url, location.href).pathname;
      const method = String(init.method || 'GET').toUpperCase();
      if (!target.startsWith('/api/v1/services/upnp')) return originalFetch(url, init);
      if (method !== 'GET') writes.push({ target, method, body: init.body || '' });
      const payload = target.endsWith('/mappings') ? staticMappings : service;
      return new Response(JSON.stringify({ ok: true, data: payload }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    };

    let instance = mount({
      root,
      item: { id: 'upnp-service' },
      ui: {
        mountAll: node => window.DWRT_UI_KIT.mountAll(node),
        lucideIcon: (...args) => window.DWRT_UI_KIT.lucideIcon(...args),
        statusBadgeMarkup: (...args) => window.DWRT_UI_KIT.statusBadgeMarkup(...args),
        floatingSavebarMarkup: (...args) => window.DWRT_UI_KIT.floatingSavebarMarkup(...args)
      },
      utils: { escapeHtml: value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]) }
    });

    window.UPNP_FIXTURE = {
      writes,
      async ready() {
        for (let index = 0; index < 80; index += 1) {
          if (!root.textContent.includes('正在读取配置') && root.querySelector('.upnp-settings-surface')) return true;
          await new Promise(resolve => setTimeout(resolve, 25));
        }
        return false;
      },
      unmount() { instance?.unmount?.(); instance = null; }
    };
  </script>
</body>
</html>
