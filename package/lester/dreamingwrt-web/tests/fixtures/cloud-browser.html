<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Cloud contract fixture</title>
  <link rel="stylesheet" href="/static/css/dwrt-theme.css">
  <link rel="stylesheet" href="/static/css/menu-shell.css">
  <link rel="stylesheet" href="/static/ui-kit/dwrt-ui-kit.css">
  <link rel="stylesheet" href="/static/css/system-settings.css">
  <script src="/static/ui-kit/dwrt-ui-kit.js"></script>
  <style>
    :root { font-family: sans-serif; }
    body { margin: 0; } main { max-width: 960px; padding: 20px; margin: auto; }
  </style>
</head>
<body><main class="system-settings-route-host"><div class="system-admin-tab-panel system-admin-remote-tab"><div id="fixture" data-browser-access-host></div></div></main>
<script type="module">
import { createBrowserAccess } from '/plugins/native/cloud-browser.js';
const request = async (url, body) => {
  const response = await fetch(url, body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  const data = await response.json();
  if (!response.ok) throw Object.assign(new Error(data.error.code), {status: response.status, payload: data});
  return data;
};
window.browserAccessFixture = createBrowserAccess({
  get: async (url, options) => {
    if (!options) return request(url);
    const response = await fetch(url, options); const data = await response.json();
    if (!response.ok) throw Object.assign(new Error(data.error.code), {status: response.status, payload: data});
    return data;
  }, post: request, ui: window.DWRT_UI_KIT,
  escapeHtml: value => String(value ?? '').replace(/[&<>"']/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char])),
  icon: () => ''
});
window.browserAccessFixture.connect(document.querySelector('#fixture'));
</script>
</body></html>
