<title>广告分析 · DreamingOS</title>
<script>
(()=>{const h=document.documentElement,m=matchMedia('(prefers-color-scheme: dark)');function set(){let f=localStorage.getItem('dreamingwrt.web.themeFamily')||'frosted-glass',p=localStorage.getItem('dreamingwrt.web.themePref')||'system';h.dataset.themeResolved=p==='dark'||p==='system'&&m.matches?'dark':'light';try{if(parent!==window&&parent.location.origin===location.origin&&parent.DWRT_DESKTOP_HOST){f=parent.document.documentElement.dataset.themeFamily||f;h.dataset.themeResolved=parent.document.documentElement.dataset.themeResolved||h.dataset.themeResolved;h.dataset.desktopApp='true';}}catch(_){}h.dataset.themeFamily=['traditional','frosted-glass','liquid-glass'].includes(f)?f:'frosted-glass';}set();addEventListener('storage',set);m.addEventListener('change',set);try{if(parent!==window&&parent.DWRT_DESKTOP_HOST){new MutationObserver(set).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme-family','data-theme-resolved']});}}catch(_){}})();
</script>
