<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>虚拟机 · DreamingOS</title>
  <link rel="icon" href="/static/desktop/assets/resource-manager.png">
  <script>
    (() => {
      const root = document.documentElement;
      function theme() {
        let family = 'frosted-glass', pref = 'system';
        try {
          family = localStorage.getItem('dreamingwrt.web.themeFamily') || family;
          pref = localStorage.getItem('dreamingwrt.web.themePref') || pref;
        } catch (_) {}
        root.dataset.themeFamily = ['frosted-glass', 'liquid-glass', 'traditional'].includes(family) ? family : 'frosted-glass';
        root.dataset.themeResolved = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      theme();
      addEventListener('storage', theme);
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
      try {
        if (parent !== window && parent.location.origin === location.origin && parent.DWRT_DESKTOP_HOST) {
          window.DWRT_SESSION = parent.DWRT_SESSION;
          root.dataset.desktopApp = 'true';
        }
      } catch (_) {}
      window.DWRT_DESKTOP_HOST = true;
    })();
  </script>
  <link rel="stylesheet" href="/static/ui-kit/dwrt-ui-kit.css?v=20260905-sidebar-tabs-01">
  <link rel="stylesheet" href="/static/css/dwrt-theme.css?v=20260722-03">
  <link rel="stylesheet" href="/static/css/theme-families.css?v=20260929-frosted-argon-03">
  <link rel="stylesheet" href="/static/desktop/dwrt-rail.css?v=20261004-rail-foreground-01">
  <link rel="stylesheet" href="/static/desktop/virtual-machine/virtual-machine.css?v=20261007-vm-uuid-01">
</head>
<body>
  <div class="vm-shell" id="vmApp" data-view="loading">
    <button class="vm-rail-backdrop" data-action="sidebar-close" aria-label="关闭导航" hidden></button>
    <aside class="vm-sidebar dwrt-rail" aria-label="虚拟机导航">
      <div class="dwrt-rail-brand" aria-hidden="true">
        <img src="/static/images/logo-wide.png?v=20260919-brand-01" alt="DreamingOS">
      </div>
      <button class="dwrt-kit-button vm-icon-button vm-rail-close" data-action="sidebar-close" aria-label="关闭导航" title="关闭导航"><i data-lucide="panel-left-close"></i></button>
      <nav id="vmNav" class="dwrt-rail-list" aria-label="功能导航"></nav>
      <div class="vm-service-badge dwrt-rail-foot" id="vmServiceBadge" hidden></div>
    </aside>
    <main class="vm-main" id="vmMain">
      <div class="vm-topbar">
        <button class="dwrt-kit-button vm-icon-button vm-sidebar-toggle" data-action="sidebar" aria-label="显示导航" title="导航"><i data-lucide="panel-left"></i></button>
        <h1 class="vm-page-title" id="vmPageTitle" tabindex="-1">概览</h1>
        <div class="vm-topbar-actions" id="vmTopActions"></div>
        <button class="dwrt-kit-button vm-icon-button" data-action="refresh" aria-label="刷新" title="刷新"><i data-lucide="refresh-cw"></i></button>
      </div>
      <div class="vm-notice" id="vmNotice" role="status" hidden></div>
      <div class="vm-content dwrt-kit-table-scroll" id="vmContent" tabindex="0" aria-label="虚拟机内容"></div>
    </main>
  </div>
  <div id="vmSheetHost"></div>
  <div id="vmConfirmHost"></div>
  <div class="vm-menu dwrt-kit-dropdown" id="vmMenu" role="menu" hidden></div>
  <script src="/static/js/dwrt-session-gate.js?v=20260808-region-ink-uses-painted-density-01" defer></script>
  <script src="/static/ui-kit/lucide.min.js" defer></script>
  <script src="/static/ui-kit/dwrt-ui-kit.js?v=20260905-sidebar-tabs-01" defer></script>
  <script src="/static/desktop/glass-foreground.js?v=20261004-transparent-foreground-01" defer></script>
  <script src="/static/desktop/virtual-machine/virtual-machine.js?v=20261007-vm-uuid-01" defer></script>
</body>
</html>
