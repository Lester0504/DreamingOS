@SERIAL_CONFIG@
@TERMINAL_CONFIG@

set theme_ready=0
if [ -f /boot/grub/themes/dreamingwrt/theme.txt ] && [ -f /boot/grub/themes/dreamingwrt/background.jpg ]; then
    if loadfont /boot/grub/themes/dreamingwrt/terminus-14.pf2; then
        set gfxmode=1920x1080,1280x720,1024x768,auto
        set gfxpayload=text
        if terminal_output gfxterm; then
            terminal_output --append serial
            set theme=/boot/grub/themes/dreamingwrt/theme.txt
            export theme
            set theme_ready=1
        else
            @TERMINAL_CONFIG@
        fi
    fi
fi

set default="0"
set timeout="3"

if [ "${grub_platform}" = "efi" ]; then
    set root='(cd0)'
else
    set root='(cd)'
fi

menuentry "@TITLE@ Installer" {
	linux /boot/vmlinuz @CMDLINE@ dreamingwrt.install=1 dreamingwrt.iso_label=DWRT_INSTALL
	initrd /boot/installer-initramfs.cpio.gz
}
