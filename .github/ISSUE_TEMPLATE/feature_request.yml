name: 功能建议 / Feature request
description: 提议范围明确且可验证的功能
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述实际工作流和当前限制，不要只给出方案名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不要求公开私有 DPI、指纹或图库数据。
          required: true
        - label: 我已搜索现有 Issue 和 PR。
          required: true
